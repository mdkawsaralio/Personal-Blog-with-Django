{% extends "base.html" %}
{% load static  %}

{% block title %}
This post Title
{% endblock  %}

{% block css_file %}
<link rel="stylesheet" href="{% static "blog/post-detail.css" %}">

{% endblock  %}

{% block content %}
<section id="summary">
    <h2>Post Title</h2>
    <article>
        <img src="{% static "blog/images/"|add:post.image %}" alt="">
        <address>By {{post.author}}</address>
        <div>
            Last updata on <time>{{post.date}}</time>
        </div>
    </article>
</section>
<main>
    {{post.content}}
</main>

{% endblock %}
